# TEMPORARY: runs make integration on this PR. Deleted before merge.
name: Trial integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make integration TESTFLAGS=-v
