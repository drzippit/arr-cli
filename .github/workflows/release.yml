# Pushing a tag such as v0.1.0 tests arr, including the integration tests
# against real Sonarr, Radarr and SABnzbd, builds it for every platform in the
# Makefile's PLATFORMS, and publishes a GitHub release of the tag with those
# archives and their SHA256SUMS. A tag with a hyphen (v0.2.0-rc1) becomes a
# pre-release. A tag that is not SemVer or not on main, or a build whose
# arr --version does not give the tag, fails before anything is published
# (ADR 0004, docs/agents/branching.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not vMAJOR.MINOR.PATCH with an optional -prerelease (ADR 0004)"
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main; Releases are cut from main only (docs/agents/branching.md)"
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}

      - name: Test
        run: |
          go vet ./...
          go test ./...

      # Real Sonarr, Radarr and SABnzbd in Docker, so a Release never goes out without
      # running against them (docs/integration-tests.md).
      - name: Integration tests
        run: make integration

      - name: Build
        run: make dist VERSION="$TAG"
        env:
          TAG: ${{ github.ref_name }}

      - name: Check the stamped version
        run: |
          got=$(tar -xzOf "dist/arr_${TAG}_linux_amd64.tar.gz" arr > arr-check && chmod +x arr-check && ./arr-check --version)
          rm arr-check
          if [ "$got" != "arr $TAG" ]; then
            echo "::error::the built arr says '$got', want 'arr $TAG'"
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}

      - name: Publish
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG" "${prerelease[@]}"
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
