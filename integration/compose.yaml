# Sonarr and Radarr for the integration tests; `make integration` starts and
# stops them. See docs/integration-tests.md.
#
# Each image is pinned to an exact release so test runs are repeatable. The
# API keys and ports come from the Makefile; the keys reach the Apps through
# their environment settings, so the tests know them without reading the
# Apps' config files. /tv and /movies are empty folders a test can make a root
# folder. Nothing is kept between runs.

x-instance: &instance
  environment: &env
    PUID: "1000"
    PGID: "1000"
    TZ: Etc/UTC
  healthcheck: &health
    interval: 3s
    timeout: 3s
    retries: 60
    start_period: 10s

services:
  sonarr:
    <<: *instance
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls6
    environment:
      <<: *env
      SONARR__AUTH__APIKEY: ${ARR_IT_SONARR_API_KEY:?set by make integration}
    ports:
      - "127.0.0.1:${ARR_IT_SONARR_PORT:?set by make integration}:8989"
    tmpfs:
      - /tv:mode=1777
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS -H \"X-Api-Key: $$SONARR__AUTH__APIKEY\" http://localhost:8989/api/v3/system/status"]

  radarr:
    <<: *instance
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    environment:
      <<: *env
      RADARR__AUTH__APIKEY: ${ARR_IT_RADARR_API_KEY:?set by make integration}
    ports:
      - "127.0.0.1:${ARR_IT_RADARR_PORT:?set by make integration}:7878"
    tmpfs:
      - /movies:mode=1777
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS -H \"X-Api-Key: $$RADARR__AUTH__APIKEY\" http://localhost:7878/api/v3/system/status"]
