# Sonarr, Radarr and SABnzbd for the integration tests; `make integration` starts and
# stops them. See docs/integration-tests.md.
#
# Each image is pinned to an exact release so test runs are repeatable. The
# API keys and ports come from the Makefile; the keys reach the Apps through
# their environment settings, so the tests know them without reading the
# Apps' config files. /tv and /movies are empty folders a test can make a root
# folder. SABnzbd takes no API key from its environment, so its service
# writes one into a new sabnzbd.ini before SABnzbd starts, along with
# nntp-stub as its news server: a server with no articles, so a Download that
# isn't paused fails within seconds and lands in SABnzbd's History. Nothing is
# kept between runs.

x-instance: &instance
  environment: &env
    PUID: "1000"
    PGID: "1000"
    TZ: Etc/UTC
  healthcheck: &health
    interval: 3s
    timeout: 3s
    retries: 60
    start_period: 10s

services:
  sonarr:
    <<: *instance
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls6
    environment:
      <<: *env
      SONARR__AUTH__APIKEY: ${ARR_IT_SONARR_API_KEY:?set by make integration}
    ports:
      - "127.0.0.1:${ARR_IT_SONARR_PORT:?set by make integration}:8989"
    tmpfs:
      - /tv:mode=1777
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS -H \"X-Api-Key: $$SONARR__AUTH__APIKEY\" http://localhost:8989/api/v3/system/status"]

  radarr:
    <<: *instance
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    environment:
      <<: *env
      RADARR__AUTH__APIKEY: ${ARR_IT_RADARR_API_KEY:?set by make integration}
    ports:
      - "127.0.0.1:${ARR_IT_RADARR_PORT:?set by make integration}:7878"
    tmpfs:
      - /movies:mode=1777
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS -H \"X-Api-Key: $$RADARR__AUTH__APIKEY\" http://localhost:7878/api/v3/system/status"]

  sabnzbd:
    <<: *instance
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls283
    environment:
      <<: *env
      SABNZBD_API_KEY: ${ARR_IT_SABNZBD_API_KEY:?set by make integration}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /config &&
        printf '[misc]\napi_key = %s\n[servers]\n[[nntp-stub]]\nname = nntp-stub\nhost = nntp-stub\nport = 119\nconnections = 1\nenable = 1\n'
        "$$SABNZBD_API_KEY" > /config/sabnzbd.ini &&
        exec /init
    ports:
      - "127.0.0.1:${ARR_IT_SABNZBD_PORT:?set by make integration}:8080"
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:8080/api?mode=queue&output=json&apikey=$$SABNZBD_API_KEY\""]
    depends_on:
      - nntp-stub

  nntp-stub:
    image: python:3.13.18-alpine3.24
    command: ["python", "-u", "/stub.py"]
    volumes:
      - ./nntp-stub/stub.py:/stub.py:ro
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 119), 2)"]
